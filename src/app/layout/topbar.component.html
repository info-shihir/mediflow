<header class="h-16 bg-transparent px-4 md:px-8 flex items-center justify-between gap-4 sticky top-0 z-30">
      <!-- Left: Mobile Menu + Pill Search Bar matching screenshot -->
      <div class="flex items-center gap-3 flex-1 max-w-md">
        <button
          type="button"
          (click)="toggleMenu.emit()"
          class="md:hidden w-9 h-9 flex items-center justify-center rounded-full bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors shadow-2xs cursor-pointer"
          aria-label="Toggle Navigation"
        >
          <mat-icon class="text-xl w-5 h-5">menu</mat-icon>
        </button>

        <!-- Pill Search Bar with mic icon -->
        <div class="relative w-full max-w-xs sm:max-w-sm">
          <div class="bg-white border border-slate-200/80 rounded-full px-3.5 py-2 flex items-center justify-between shadow-2xs hover:border-teal-400 transition-colors">
            <div class="flex items-center gap-2 flex-1">
              <mat-icon class="text-slate-400 text-base w-4 h-4 shrink-0">search</mat-icon>
              <input
                #searchInput
                type="text"
                placeholder="Search inventory, Rx, SKU..."
                (keydown.enter)="onSearch(searchInput.value)"
                class="w-full bg-transparent border-0 p-0 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-0"
              />
            </div>
            <mat-icon class="text-slate-400 text-base w-4 h-4 cursor-pointer hover:text-slate-600 shrink-0">
              mic
            </mat-icon>
          </div>
        </div>
      </div>

      <!-- Right: Active Branch Pill + Language Pill + Notifications -->
      <div class="flex items-center gap-2.5 md:gap-3 shrink-0">
        <!-- Active Branch / Store Location Indicator -->
        <div class="hidden sm:flex items-center gap-1.5 bg-white border border-slate-200/80 rounded-full px-3 py-1.5 shadow-2xs text-xs font-semibold text-slate-700">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Downtown Flagship</span>
        </div>

        <!-- Language Switcher Pill -->
        <div class="hidden md:flex items-center gap-1.5 bg-white border border-slate-200/80 rounded-full px-3 py-1.5 shadow-2xs text-xs font-bold text-slate-700">
          <span class="w-4 h-4 rounded-full bg-slate-900 text-white text-[9px] flex items-center justify-center font-mono">
            🌐
          </span>
          <span>EN</span>
          <mat-icon class="text-xs w-3 h-3 text-slate-400">expand_more</mat-icon>
        </div>

        <!-- Notification Trigger Badge with FEFO Alerts Counter -->
        <button
          type="button"
          (click)="toggleNotifications()"
          class="w-9 h-9 flex items-center justify-center rounded-full bg-white border border-slate-200/80 text-slate-600 hover:bg-slate-50 transition-colors shadow-2xs relative cursor-pointer"
          [title]="'FEFO Expiry Alerts (' + store.unacknowledgedFefoCount() + ' batches nearing expiry)'"
          aria-label="Operations & FEFO Expiry Alerts"
        >
          <mat-icon class="text-lg w-4 h-4" [class.text-amber-600]="store.unacknowledgedFefoCount() > 0">notifications_active</mat-icon>
          @if (store.unacknowledgedFefoCount() > 0) {
            <span
              class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full text-white text-[9px] font-mono font-black flex items-center justify-center shadow-xs"
              [class.bg-rose-600]="store.criticalFefoCount() > 0"
              [class.animate-pulse]="store.criticalFefoCount() > 0"
              [class.bg-amber-500]="store.criticalFefoCount() === 0"
            >
              {{ store.unacknowledgedFefoCount() }}
            </span>
          } @else if (store.attentionCount() > 0) {
            <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-[#FBA7A7]"></span>
          }
        </button>

        <!-- User Profile Quick Link -->
        <a
          routerLink="/profile"
          class="w-9 h-9 flex items-center justify-center rounded-full bg-[#0A2623] hover:bg-slate-900 text-white font-black text-xs shadow-2xs transition-colors cursor-pointer"
          title="My Staff Profile"
          aria-label="My Staff Profile"
        >
          <span>{{ store.roleConfig().initials || '👤' }}</span>
        </a>
      </div>

      <!-- Slide-over FEFO Notification Center -->
      @if (showNotificationCenter()) {
        <app-fefo-notification-center (dismissDrawer)="showNotificationCenter.set(false)" />
      }
    </header>
